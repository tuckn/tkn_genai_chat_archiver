# tkn-genai-chat-archiver configuration
# Paths below are examples. Replace them with your own folders.
schema_version: "1.0.0"

# Run logs and reports (not the archive itself).
# logs_root: ~/.tkn/genai_chat_archiver/state/logs
# reports_root: ~/.tkn/genai_chat_archiver/state/reports

defaults:
  settle_seconds: 600   # skip files modified within this many seconds
  read_only: true       # mark stored versions and finished manifests read-only

targets:
  codex-my-pc-windows:
    profile: codex
    source_root: ~/.codex
    archive_root: C:\path\to\sources\softwares\Codex\chatLogs\my-pc-windows
    device_id: 2023 Example PC
    environment: windows

