[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tkn-genai-chat-archiver"
version = "0.2.0"
description = "Keep byte-exact, versioned snapshots of local generative AI chat logs without inference."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tuckn" }]
dependencies = [
  "PyYAML>=6,<7",
  "zstandard>=0.23,<1",
]

[project.scripts]
tkn-genai-chat-archiver = "tkn_genai_chat_archiver.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-PyYAML>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tkn_genai_chat_archiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tkn_genai_chat_archiver"]

[[tool.mypy.overrides]]
module = "zstandard"
ignore_missing_imports = true
